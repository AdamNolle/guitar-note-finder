<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar Note Finder</title>
  <meta name="description" content="A game that teaches you to find every note on the guitar fretboard.">
  <meta name="theme-color" content="#F4F5F8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="2" y="6" width="36" height="28" rx="6" fill="#E8CD9C" stroke="#B89463" stroke-width="1.2"/>
          <rect x="9" y="6" width="3.5" height="28" fill="#F4EFE2" stroke="#9C8E78" stroke-width="0.8"/>
          <line x1="23" y1="6" x2="23" y2="34" stroke="#8E959E" stroke-width="1.6"/>
          <line x1="32" y1="6" x2="32" y2="34" stroke="#8E959E" stroke-width="1.6"/>
          <line x1="2" y1="13" x2="38" y2="13" stroke="#5E636B" stroke-width="1.6"/>
          <line x1="2" y1="20" x2="38" y2="20" stroke="#5E636B" stroke-width="1.3"/>
          <line x1="2" y1="27" x2="38" y2="27" stroke="#8E959E" stroke-width="1"/>
          <circle cx="27.5" cy="20" r="4.2" fill="#2563EB"/>
        </svg>
        <div>
          <h1>Guitar Note Finder</h1>
          <p>Learn every note on the neck, one fret at a time</p>
        </div>
      </div>
      <div class="pill" id="high-pill"></div>
    </header>

    <main class="layout">
      <section class="card game" id="game" aria-label="Game"></section>
      <aside class="card side" id="side" aria-label="Scores and progress"></aside>
      <section class="card board-card" id="board" aria-label="Fretboard"></section>
      <section class="card settings" id="settings" aria-label="Settings"></section>
    </main>

    <footer class="foot">
      Keyboard: <kbd>A</kbd>–<kbd>G</kbd> to name a note, <kbd>Shift</kbd>+letter for a sharp, <kbd>Space</kbd> to start or skip ahead, <kbd>Esc</kbd> to end a game.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
